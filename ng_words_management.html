<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NG Word Management - DocRev</title>
    <link href="css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }

        .sidebar-item.active {
            background-color: #eef2ff;
            color: #4f46e5;
            border-right: 4px solid #4f46e5;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="min-h-screen text-gray-800 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm z-50">
        <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="material-icons text-indigo-600 text-3xl">block</span>
                <h1 id="titleText"
                    class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    금지어 관리</h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- Language Selector -->
                <div class="relative group">
                    <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 transition-colors">
                        <span class="material-icons text-gray-500 text-lg">language</span>
                        <span id="currentLang" class="text-sm font-medium">한국어</span>
                    </button>
                    <div class="absolute right-0 top-full mt-1 w-32 bg-white rounded-lg shadow-xl border border-gray-100 hidden group-hover:block overflow-hidden">
                        <button onclick="setLanguage('ko')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">한국어</button>
                        <button onclick="setLanguage('en')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">English</button>
                        <button onclick="setLanguage('ja')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">日本語</button>
                    </div>
                </div>

                <a href="pdf_comment_workspace.html" id="backToWorkspace"
                    class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 transition-colors bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
                    <span class="material-icons text-sm">arrow_back</span>
                    <span class="text-sm font-medium">워크스페이스로 돌아가기</span>
                </a>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 id="sidebarTitle" class="font-bold text-gray-700">금지어 그룹</h3>
                <button onclick="createNewGroup()" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
                    <span class="material-icons">add_circle</span>
                </button>
            </div>
            <nav id="groupList" class="flex-1 overflow-y-auto py-2">
                <!-- Groups will be listed here -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <div id="noSelection" class="flex flex-col items-center justify-center h-full text-gray-400 hidden">
                <span class="material-icons text-6xl mb-4">folder_open</span>
                <p id="noSelectionText">그룹을 선택하거나 새로 만드세요.</p>
            </div>

            <div id="mainContent" class="max-w-5xl mx-auto space-y-6">
                <!-- Group Header Info -->
                <div class="glass-panel rounded-2xl p-6 flex items-center justify-between shadow-sm">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="selectedGroupName" class="text-2xl font-bold text-gray-900">-</h2>
                            <button onclick="renameCurrentGroup()" class="text-gray-400 hover:text-indigo-600 transition-colors">
                                <span class="material-icons text-lg">edit</span>
                            </button>
                        </div>
                        <p id="groupDescription" class="text-sm text-gray-500 mt-1">선택된 금지어 그룹의 데이터를 관리합니다.</p>
                    </div>
                    <button onclick="deleteCurrentGroup()" id="deleteGroupBtn" class="px-3 py-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors text-sm font-medium flex items-center gap-1">
                        <span class="material-icons text-sm">delete</span>
                        <span id="deleteGroupText">그룹 삭제</span>
                    </button>
                </div>

                <!-- Add New Word Section -->
                <div class="glass-panel rounded-2xl p-6 shadow-sm">
                    <h3 id="addWordTitle" class="text-lg font-semibold text-gray-800 mb-6">새 금지어 추가</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="space-y-2">
                            <label id="labelWord" class="text-xs font-bold text-gray-500 uppercase">금지어</label>
                            <input type="text" id="newWordInput" placeholder="예: 최고, No.1" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" />
                        </div>
                        <div class="space-y-2">
                            <label id="labelRule" class="text-xs font-bold text-gray-500 uppercase">가이드라인 조항</label>
                            <input type="text" id="newRuleInput" placeholder="예: 제1조 2항" 
                                class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all" />
                        </div>
                    </div>
                    <div class="space-y-2 mb-6">
                        <label id="labelSuggestion" class="text-xs font-bold text-gray-500 uppercase">수정 제안</label>
                        <textarea id="newSuggestionInput" rows="2" placeholder="사용자에게 표시될 권고 문구..."
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition-all"></textarea>
                    </div>
                    <div class="flex justify-end">
                        <button onclick="addWord()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-medium hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 flex items-center gap-2">
                            <span class="material-icons">add</span>
                            <span id="addBtnText">추가하기</span>
                        </button>
                    </div>
                </div>

                <!-- Word List Table -->
                <div class="glass-panel rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
                        <h3 id="listTitle" class="font-bold text-gray-700">금지어 목록</h3>
                        <span id="wordCount" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">0개</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50/50 text-xs font-bold text-gray-400 uppercase tracking-wider">
                                <tr>
                                    <th id="thWord" class="px-6 py-4">금지어</th>
                                    <th id="thRule" class="px-6 py-4">가이드라인</th>
                                    <th id="thSuggestion" class="px-6 py-4">수정 제안</th>
                                    <th class="px-6 py-4 text-right">관리</th>
                                </tr>
                            </thead>
                            <tbody id="wordsTableBody" class="divide-y divide-gray-100 bg-white">
                                <!-- Data will be here -->
                            </tbody>
                        </table>
                        <div id="emptyList" class="py-20 flex flex-col items-center justify-center text-gray-400 hidden">
                            <span class="material-icons text-5xl mb-2">search_off</span>
                            <p id="emptyText">등록된 금지어가 없습니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-lg">금지어 수정</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label id="modalOldLabel" class="text-xs font-bold text-gray-400 uppercase">기존 단어</label>
                        <p id="oldWordDisplay" class="bg-gray-50 p-2 rounded-lg text-sm text-gray-500 border border-gray-100"></p>
                    </div>
                    <div class="space-y-1">
                        <label id="modalNewLabel" class="text-xs font-bold text-gray-400 uppercase">새 단어</label>
                        <input type="text" id="editWordInput" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none" />
                    </div>
                </div>
                <div class="space-y-1">
                    <label id="modalRuleLabel" class="text-xs font-bold text-gray-400 uppercase">가이드라인 조항</label>
                    <input type="text" id="editRuleInput" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none" />
                </div>
                <div class="space-y-1">
                    <label id="modalSuggestionLabel" class="text-xs font-bold text-gray-400 uppercase">수정 제안</label>
                    <textarea id="editSuggestionInput" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeEditModal()" id="modalCancelBtn" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-200 rounded-lg transition-colors">취소</button>
                <button onclick="saveEdit()" id="modalSaveBtn" class="px-6 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-lg shadow-indigo-100">저장하기</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h3 id="customModalTitle" class="text-lg font-bold text-slate-900">제목</h3>
                <button onclick="closeCustomModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div id="customModalInputContainer">
                    <input type="text" id="customModalInput" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all font-medium"
                        onkeypress="if(event.key==='Enter') handleCustomModalConfirm()">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeCustomModal()" 
                        class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-bold transition-all">취소</button>
                    <button id="customModalConfirmBtn" onclick="handleCustomModalConfirm()"
                        class="flex-1 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold transition-all shadow-lg shadow-indigo-500/20">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 right-8 z-[200] bg-white border border-slate-200 rounded-xl shadow-2xl p-4 flex items-center gap-3 transition-all transform translate-y-20 opacity-0 pointer-events-none">
        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center">
            <span id="toastIcon" class="material-icons text-green-500">check_circle</span>
        </div>
        <p id="toastMessage" class="text-sm font-bold text-slate-700"></p>
    </div>

    <script>
        const TRANSLATIONS = {
            ko: {
                title: "금지어 관리",
                back: "워크스페이스",
                sidebar: "금지어 그룹",
                noSelection: "그룹을 선택하거나 새로 만드세요.",
                deleteGroup: "그룹 삭제",
                groupDesc: "선택된 금지어 그룹의 데이터를 관리합니다.",
                addTitle: "새 금지어 추가",
                lWord: "금지어", lRule: "가이드라인 조항", lSuggestion: "수정 제안",
                addBtn: "추가하기",
                listTitle: "금지어 목록",
                thWord: "금지어", thRule: "가이드라인", thSuggestion: "수정 제안",
                emptyText: "등록된 금지어가 없습니다.",
                modalTitle: "금지어 수정",
                mOld: "기존 단어", mNew: "새 단어", mBtnCancel: "취소", mBtnSave: "저장하기",
                confirmDelete: "삭제하시겠습니까?",
                groupNamePrompt: "새 그룹 이름을 입력하세요:",
                renamePrompt: "새 이름을 입력하세요:",
                currentLangName: "한국어",
                countSuffix: "개",
                msgSave: "저장되었습니다.",
                msgError: "오류가 발생했습니다."
            },
            en: {
                title: "NG Words Management",
                back: "Workspace",
                sidebar: "Word Groups",
                noSelection: "Select or Create a Group.",
                deleteGroup: "Delete Group",
                groupDesc: "Manage NG words for the selected group.",
                addTitle: "Add New NG Word",
                lWord: "NG Word", lRule: "Guideline Clause", lSuggestion: "Suggestion",
                addBtn: "Add Word",
                listTitle: "Word List",
                thWord: "Word", thRule: "Guideline", thSuggestion: "Suggestion",
                emptyText: "No NG words registered.",
                modalTitle: "Edit NG Word",
                mOld: "Existing", mNew: "New", mBtnCancel: "Cancel", mBtnSave: "Save",
                confirmDelete: "Are you sure you want to delete?",
                groupNamePrompt: "Enter new group name:",
                renamePrompt: "Enter new name:",
                currentLangName: "English",
                countSuffix: "",
                msgSave: "Saved successfully.",
                msgError: "An error occurred."
            },
            ja: {
                title: "NG用語管理",
                back: "ワークスペース",
                sidebar: "用語グループ",
                noSelection: "グループを選択するか新しく作成してください。",
                deleteGroup: "グループ削除",
                groupDesc: "選択されたNG用語グループのデータを管理します。",
                addTitle: "新規NG用語追加",
                lWord: "NG用語", lRule: "ガイドライン条項", lSuggestion: "修正案",
                addBtn: "追加する",
                listTitle: "用語リスト",
                thWord: "NG用語", thRule: "ガイドライン", thSuggestion: "修正案",
                emptyText: "登録されたNG用語はありません。",
                modalTitle: "NG用語修正",
                mOld: "既存", mNew: "新規", mBtnCancel: "キャンセル", mBtnSave: "保存する",
                confirmDelete: "本当に削除しますか？",
                groupNamePrompt: "新しいグループ名を入力してください:",
                renamePrompt: "新しい名前を入力してください:",
                currentLangName: "日本語",
                countSuffix: "個",
                msgSave: "保存されました。",
                msgError: "エラーが発生しました。"
            }
        };

        let currentLang = 'ko';
        let groups = [];
        let selectedGroupId = null;
        let words = [];
        let currentlyEditingWord = null;

        function setLanguage(lang) {
            currentLang = lang;
            const t = TRANSLATIONS[lang];
            
            document.getElementById('titleText').textContent = t.title;
            document.getElementById('backToWorkspace').querySelector('span:last-child').textContent = t.back;
            document.getElementById('sidebarTitle').textContent = t.sidebar;
            document.getElementById('noSelectionText').textContent = t.noSelection;
            document.getElementById('deleteGroupText').textContent = t.deleteGroup;
            document.getElementById('groupDescription').textContent = t.groupDesc;
            document.getElementById('addWordTitle').textContent = t.addTitle;
            document.getElementById('labelWord').textContent = t.lWord;
            document.getElementById('labelRule').textContent = t.lRule;
            document.getElementById('labelSuggestion').textContent = t.lSuggestion;
            document.getElementById('addBtnText').textContent = t.addBtn;
            document.getElementById('listTitle').textContent = t.listTitle;
            document.getElementById('thWord').textContent = t.thWord;
            document.getElementById('thRule').textContent = t.thRule;
            document.getElementById('thSuggestion').textContent = t.thSuggestion;
            document.getElementById('emptyText').textContent = t.emptyText;
            document.getElementById('currentLang').textContent = t.currentLangName;
            
            document.getElementById('modalTitle').textContent = t.modalTitle;
            document.getElementById('modalOldLabel').textContent = t.mOld;
            document.getElementById('modalNewLabel').textContent = t.mNew;
            document.getElementById('modalRuleLabel').textContent = t.lRule;
            document.getElementById('modalSuggestionLabel').textContent = t.lSuggestion;
            document.getElementById('modalCancelBtn').textContent = t.mBtnCancel;
            document.getElementById('modalSaveBtn').textContent = t.mBtnSave;

            renderGroups();
            if (selectedGroupId) renderWords();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            const icon = document.getElementById('toastIcon');
            icon.textContent = isError ? 'error' : 'check_circle';
            icon.className = `material-icons ${isError ? 'text-red-500' : 'text-green-500'}`;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        async function loadGroups() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/ng-words/groups`);
                groups = await res.json();
                renderGroups();
                if (groups.length > 0 && !selectedGroupId) {
                    selectGroup(groups[0].id);
                } else if (groups.length === 0) {
                    updateView(null);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderGroups() {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            groups.forEach(g => {
                const item = document.createElement('div');
                item.className = `sidebar-item px-6 py-3 cursor-pointer flex items-center gap-3 transition-all ${selectedGroupId === g.id ? 'active' : 'hover:bg-gray-50'}`;
                item.onclick = () => selectGroup(g.id);
                item.innerHTML = `
                    <span class="material-icons opacity-70">${selectedGroupId === g.id ? 'folder_open' : 'folder'}</span>
                    <span class="text-sm font-medium truncate">${g.name}</span>
                `;
                list.appendChild(item);
            });
        }

        function selectGroup(id) {
            selectedGroupId = id;
            renderGroups();
            updateView(id);
            fetchWords();
        }

        function updateView(id) {
            const main = document.getElementById('mainContent');
            const placeholder = document.getElementById('noSelection');
            if (id) {
                main.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                main.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        async function fetchWords() {
            if (!selectedGroupId) return;
            try {
                const res = await fetch(`${API_BASE_URL}/api/ng-words?group_id=${selectedGroupId}`);
                words = await res.json();
                renderWords();
                const group = groups.find(g => g.id === selectedGroupId);
                document.getElementById('selectedGroupName').textContent = group ? group.name : '-';
            } catch (err) {
                console.error(err);
            }
        }

        function renderWords() {
            const t = TRANSLATIONS[currentLang];
            const tbody = document.getElementById('wordsTableBody');
            const empty = document.getElementById('emptyList');
            const count = document.getElementById('wordCount');
            
            tbody.innerHTML = '';
            count.textContent = `${words.length}${t.countSuffix}`;

            if (words.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            
            empty.classList.add('hidden');
            words.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/50 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-indigo-600">${item.word}</td>
                    <td class="px-6 py-4 text-xs text-gray-400">${item.rule || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate">${item.suggestion || '-'}</td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="openEditModal('${item.word}')" class="p-2 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all">
                                <span class="material-icons text-sm">edit</span>
                            </button>
                            <button onclick="deleteWord('${item.word}')" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all">
                                <span class="material-icons text-sm">delete</span>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        let customModalCallback = null;

        function openCustomModal({ title, placeholder, initialValue, isConfirm, callback }) {
            document.getElementById('customModalTitle').textContent = title;
            document.getElementById('customModalInput').placeholder = placeholder || '';
            document.getElementById('customModalInput').value = initialValue || '';
            
            const inputContainer = document.getElementById('customModalInputContainer');
            const confirmBtn = document.getElementById('customModalConfirmBtn');
            
            if (isConfirm) {
                inputContainer.classList.add('hidden');
                confirmBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                confirmBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            } else {
                inputContainer.classList.remove('hidden');
                confirmBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                confirmBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }
            
            customModalCallback = callback;
            document.getElementById('custom-modal').classList.remove('hidden');
            if (!isConfirm) document.getElementById('customModalInput').focus();
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            customModalCallback = null;
        }

        function handleCustomModalConfirm() {
            if (customModalCallback) {
                customModalCallback(document.getElementById('customModalInput').value);
            }
            closeCustomModal();
        }

        async function createNewGroup() {
            const t = TRANSLATIONS[currentLang];
            openCustomModal({
                title: t.sidebar,
                placeholder: t.groupNamePrompt,
                callback: async (name) => {
                    if (!name) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/ng-words/groups`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        if (res.ok) {
                            const newGroup = await res.json();
                            groups.push(newGroup);
                            renderGroups();
                            selectGroup(newGroup.id);
                            showToast(t.msgSave);
                        } else {
                            const err = await res.json();
                            showToast(err.error, true);
                        }
                    } catch (err) {
                        showToast(t.msgError, true);
                    }
                }
            });
        }

        async function renameCurrentGroup() {
            const t = TRANSLATIONS[currentLang];
            if (!selectedGroupId || selectedGroupId === 'default') return;

            const group = groups.find(g => g.id === selectedGroupId);
            openCustomModal({
                title: t.modalTitle,
                placeholder: t.renamePrompt,
                initialValue: group ? group.name : "",
                callback: async (name) => {
                    if (!name || (group && name === group.name)) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/ng-words/groups/${selectedGroupId}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        if (res.ok) {
                            const updatedGroup = await res.json();
                            const idx = groups.findIndex(g => g.id === selectedGroupId);
                            if (idx !== -1) groups[idx].name = updatedGroup.name;
                            renderGroups();
                            document.getElementById('selectedGroupName').textContent = updatedGroup.name;
                            showToast(t.msgSave);
                        } else {
                            const err = await res.json();
                            showToast(err.error, true);
                        }
                    } catch (err) {
                        showToast(t.msgError, true);
                    }
                }
            });
        }

        async function deleteCurrentGroup() {
            const t = TRANSLATIONS[currentLang];
            if (!selectedGroupId || selectedGroupId === 'default') return;

            openCustomModal({
                title: t.confirmDelete,
                isConfirm: true,
                callback: async () => {
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/ng-words/groups/${selectedGroupId}`, { 
                            method: 'DELETE' 
                        });
                        if (res.ok) {
                            groups = groups.filter(g => g.id !== selectedGroupId);
                            selectedGroupId = null;
                            renderGroups();
                            updateView(null);
                            showToast(t.msgSave);
                        } else {
                            const err = await res.json();
                            showToast(err.error, true);
                        }
                    } catch (err) {
                        showToast(t.msgError, true);
                    }
                }
            });
        }

        async function addWord() {
            const wordInput = document.getElementById('newWordInput');
            const ruleInput = document.getElementById('newRuleInput');
            const sugInput = document.getElementById('newSuggestionInput');
            
            const word = wordInput.value.trim();
            if (!word) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/ng-words`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        group_id: selectedGroupId,
                        word,
                        rule: ruleInput.value.trim(),
                        suggestion: sugInput.value.trim()
                    })
                });
                if (res.ok) {
                    wordInput.value = ''; ruleInput.value = ''; sugInput.value = '';
                    fetchWords();
                    showToast("Added successfully");
                } else {
                    const err = await res.json();
                    showToast(err.error, true);
                }
            } catch (err) { console.error(err); }
        }

        async function deleteWord(word) {
            if (!confirm(TRANSLATIONS[currentLang].confirmDelete)) return;
            try {
                await fetch(`${API_BASE_URL}/api/ng-words`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_id: selectedGroupId, word })
                });
                fetchWords();
            } catch (err) { console.error(err); }
        }

        function openEditModal(word) {
            const item = words.find(w => w.word === word);
            if (!item) return;
            currentlyEditingWord = word;
            document.getElementById('oldWordDisplay').textContent = word;
            document.getElementById('editWordInput').value = word;
            document.getElementById('editRuleInput').value = item.rule || '';
            document.getElementById('editSuggestionInput').value = item.suggestion || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEdit() {
            const newWord = document.getElementById('editWordInput').value.trim();
            if (!newWord) return;

            try {
                const res = await fetch(`${API_BASE_URL}/api/ng-words`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        group_id: selectedGroupId,
                        old_word: currentlyEditingWord,
                        new_word: newWord,
                        rule: document.getElementById('editRuleInput').value.trim(),
                        suggestion: document.getElementById('editSuggestionInput').value.trim()
                    })
                });
                if (res.ok) {
                    closeEditModal();
                    fetchWords();
                    showToast("Updated successfully");
                } else {
                    const err = await res.json();
                    showToast(err.error, true);
                }
            } catch (err) { console.error(err); }
        }

        // Init
        loadGroups();
    </script>
</body>

</html>
