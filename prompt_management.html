<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Management - DocRev</title>
    <link href="css/output.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', 'Noto Sans JP', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .lang-tab.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
        }

        .lang-dropdown:hover .lang-menu {
            display: block;
        }

        .group-item.active {
            background-color: #eff6ff;
            border-left: 4px solid #3b82f6;
            color: #1e40af;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <!-- Navbar (Multilingual) -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-4">
            <a href="pdf_comment_workspace.html"
                class="h-10 w-10 flex items-center justify-center rounded-full bg-slate-50 border border-slate-200 text-slate-500 hover:text-primary transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight" id="ui-title">AI 프롬프트 관리</h1>
                <p class="text-xs text-slate-500" id="ui-subtitle">언어별 AI 분석 및 대화 프롬프트를 설정합니다.</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="relative lang-dropdown">
                <button
                    class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold hover:bg-slate-50 transition-colors shadow-sm">
                    <span id="current-lang-flag" class="text-sm">🇰🇷</span>
                    <span id="current-lang-label" class="text-slate-700">한국어 (KO)</span>
                    <span class="material-symbols-outlined !text-[12px] text-slate-400">expand_more</span>
                </button>
                <div
                    class="lang-menu hidden absolute top-full right-0 mt-1 w-32 bg-white border border-slate-200 rounded-lg shadow-xl z-50 overflow-hidden">
                    <button onclick="setLanguage('ko')"
                        class="w-full text-left px-4 py-2 text-[11px] hover:bg-slate-50 border-b border-slate-100 transition-colors flex items-center gap-2">
                        <span>🇰🇷</span> <b>한국어 (KR)</b>
                    </button>
                    <button onclick="setLanguage('en')"
                        class="w-full text-left px-4 py-2 text-[11px] hover:bg-slate-50 border-b border-slate-100 transition-colors flex items-center gap-2">
                        <span>🇺🇸</span> English (EN)
                    </button>
                    <button onclick="setLanguage('ja')"
                        class="w-full text-left px-4 py-2 text-[11px] hover:bg-slate-50 transition-colors flex items-center gap-2">
                        <span>🇯🇵</span> 日本語 (JP)
                    </button>
                </div>
            </div>
            <button onclick="handleSaveAll()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md flex items-center gap-2 transition-all transform active:scale-95">
                <span class="material-symbols-outlined">save</span>
                <span id="ui-save-all">전체 저장</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar: Prompt Groups -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-100">
                <button onclick="createNewGroup()"
                    class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-sm font-bold flex items-center justify-center gap-2 transition-all shadow-sm">
                    <span class="material-symbols-outlined !text-[18px]">add_circle</span>
                    <span id="ui-add-group">새 그룹 추가</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1" id="group-list">
                <!-- Groups will be rendered here -->
                <div class="animate-pulse flex space-y-4 flex-col p-4">
                    <div class="h-10 bg-slate-100 rounded"></div>
                    <div class="h-10 bg-slate-100 rounded"></div>
                    <div class="h-10 bg-slate-100 rounded"></div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest mb-2" id="ui-group-actions">그룹 관리</p>
                <div class="flex gap-2">
                    <button onclick="renameCurrentGroup()"
                        class="flex-1 py-2 px-3 bg-white border border-slate-200 rounded-md text-slate-600 hover:text-blue-600 hover:border-blue-200 flex items-center justify-center gap-1.5 transition-all shadow-sm">
                        <span class="material-symbols-outlined !text-[16px]">edit</span>
                        <span class="text-[11px] font-bold" id="ui-rename">이름 변경</span>
                    </button>
                    <button onclick="deleteCurrentGroup()"
                        class="flex-1 py-2 px-3 bg-white border border-slate-200 rounded-md text-slate-600 hover:text-red-600 hover:border-red-200 flex items-center justify-center gap-1.5 transition-all shadow-sm">
                        <span class="material-symbols-outlined !text-[16px]">delete</span>
                        <span class="text-[11px] font-bold" id="ui-delete">삭제</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content: Prompt Editor -->
        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar bg-slate-50/30">
            <div class="max-w-4xl mx-auto space-y-8">
                <!-- Prompt Language Tabs -->
                <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 shadow-sm">
                    <button onclick="switchPromptLang('ko')"
                        class="tab-ko lang-tab active px-6 py-4 text-sm font-bold border-b-2 border-transparent transition-all">한국어 (KO)</button>
                    <button onclick="switchPromptLang('ja')"
                        class="tab-ja lang-tab px-6 py-4 text-sm font-bold border-b-2 border-transparent transition-all">일본어 (JA)</button>
                    <button onclick="switchPromptLang('en')"
                        class="tab-en lang-tab px-6 py-4 text-sm font-bold border-b-2 border-transparent transition-all">영어 (EN)</button>
                </div>

                <div class="space-y-6">
                    <!-- Review Prompt -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all hover:shadow-md">
                        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center">
                                    <span class="material-symbols-outlined !text-[20px]">analytics</span>
                                </div>
                                <div>
                                    <h2 class="font-bold text-slate-800" id="ui-review-title">문서 분석 (Review) 프롬프트</h2>
                                    <p class="text-[11px] text-slate-500" id="ui-review-desc">문서 업로드 시 가이드라인 및 금지어를 분석하는 기준을 설정합니다.</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-6">
                            <textarea id="prompt-review"
                                class="w-full h-[450px] p-5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm font-mono leading-relaxed focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 outline-none transition-all custom-scrollbar placeholder:text-slate-400"
                                placeholder="프롬프트를 입력하세요..."></textarea>
                        </div>
                    </div>

                    <!-- Chat Prompt -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all hover:shadow-md">
                        <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-lg bg-green-100 text-green-600 flex items-center justify-center">
                                    <span class="material-symbols-outlined !text-[20px]">chat_bubble</span>
                                </div>
                                <div>
                                    <h2 class="font-bold text-slate-800" id="ui-chat-title">문서 질의응답 (Chat) 프롬프트</h2>
                                    <p class="text-[11px] text-slate-500" id="ui-chat-desc">채팅 봇이 문서 내용을 바탕으로 답변할 때의 지침을 설정합니다.</p>
                                </div>
                            </div>
                        </div>
                        <div class="p-6">
                            <textarea id="prompt-chat"
                                class="w-full h-40 p-5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm font-mono leading-relaxed focus:ring-4 focus:ring-green-500/10 focus:border-green-500 outline-none transition-all custom-scrollbar placeholder:text-slate-400"
                                placeholder="프롬프트를 입력하세요..."></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-8 right-8 z-[200] bg-white border border-slate-200 rounded-xl shadow-2xl p-4 flex items-center gap-3 transition-all transform translate-y-20 opacity-0 pointer-events-none">
        <div id="toast-icon-container" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center">
            <span id="toast-icon" class="material-symbols-outlined text-green-500">check_circle</span>
        </div>
        <p id="toast-message" class="text-sm font-bold text-slate-700"></p>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">제목</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div id="modal-input-container">
                    <input type="text" id="modal-input" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium"
                        onkeypress="if(event.key==='Enter') handleModalConfirm()">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeModal()" 
                        class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-bold transition-all">취소</button>
                    <button id="modal-confirm-btn" onclick="handleModalConfirm()"
                        class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition-all shadow-lg shadow-blue-500/20">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPromptLang = 'ko';
        let currentUIlang = localStorage.getItem('prompt_lang') || 'ko';
        let promptGroups = [];
        let selectedGroupId = 'default';
        let promptsData = {}; // Data for the selected group

        const TRANSLATIONS = {
            ko: {
                title: 'AI 프롬프트 관리',
                subtitle: '언어별 AI 분석 및 대화 프롬프트를 설정합니다.',
                saveAll: '전체 저장',
                addGroup: '새 그룹 추가',
                groupActions: '그룹 관리',
                rename: '이름 변경',
                delete: '삭제',
                reviewTitle: '문서 분석 (Review) 프롬프트',
                reviewDesc: '문서 업로드 시 가이드라인 및 금지어를 분석하는 기준을 설정합니다.',
                chatTitle: '문서 질의응답 (Chat) 프롬프트',
                chatDesc: '채팅 봇이 문서 내용을 바탕으로 답변할 때의 지침을 설정합니다.',
                promptPlaceholder: '프롬프트를 입력하세요...',
                msgSave: '저장되었습니다.',
                msgFetchError: '데이터를 불러오는데 실패했습니다.',
                msgSaving: '저장 중...',
                msgSaveError: '저장 중 오류가 발생했습니다.',
                msgNewGroupName: '새 프롬프트 그룹 이름을 입력하세요:',
                msgRenameGroup: '그룹의 새 이름을 입력하세요:',
                msgConfirmDelete: '정말 이 그룹을 삭제하시겠습니까? 관련 프롬프트가 모두 삭제됩니다.',
                msgCannotDeleteDefault: '기본 그룹은 삭제할 수 없습니다.'
            },
            en: {
                title: 'AI Prompt Management',
                subtitle: 'Configure AI analysis and chat prompts for each language.',
                saveAll: 'Save All',
                addGroup: 'Add New Group',
                groupActions: 'Group Management',
                rename: 'Rename',
                delete: 'Delete',
                reviewTitle: 'Document Analysis (Review) Prompt',
                reviewDesc: 'Set criteria for analyzing guidelines and forbidden words during upload.',
                chatTitle: 'Document Q&A (Chat) Prompt',
                chatDesc: 'Set guidelines for the chatbot when answering based on document content.',
                promptPlaceholder: 'Enter prompt here...',
                msgSave: 'Saved successfully.',
                msgFetchError: 'Failed to fetch data.',
                msgSaving: 'Saving...',
                msgSaveError: 'An error occurred while saving.',
                msgNewGroupName: 'Enter new prompt group name:',
                msgRenameGroup: 'Enter new name for the group:',
                msgConfirmDelete: 'Are you sure you want to delete this group? All associated prompts will be lost.',
                msgCannotDeleteDefault: 'Default group cannot be deleted.'
            },
            ja: {
                title: 'AIプロンプト管理',
                subtitle: '言語別のAI分析およびチャットプロンプトを設定します。',
                saveAll: 'すべて保存',
                addGroup: '新規グループ追加',
                groupActions: 'グループ管理',
                rename: '名前変更',
                delete: '削除',
                reviewTitle: '文書分析 (Review) プロンプト',
                reviewDesc: 'アップロード時にガイドラインや禁止用語を分析するための基準を設定します。',
                chatTitle: '文書質疑応答 (Chat) プロンプト',
                chatDesc: 'チャットボットが文書内容に基づいて回答する際のガイドラインを設定します。',
                promptPlaceholder: 'プロンプトを入力してください...',
                msgSave: '保存されました。',
                msgFetchError: 'データの取得に失敗しました。',
                msgSaving: '保存中...',
                msgSaveError: '保存中にエラーが発生しました。',
                msgNewGroupName: '新しいプロンプトグループ名を入力してください:',
                msgRenameGroup: 'グループの新しい名前を入力してください:',
                msgConfirmDelete: 'このグループを削除してもよろしいですか？関連するプロンプトがすべて失われます。',
                msgCannotDeleteDefault: '基本グループは削除できません。'
            }
        };

        function setLanguage(lang) {
            currentUIlang = lang;
            localStorage.setItem('prompt_lang', lang);
            
            const flags = { ko: '🇰🇷', en: '🇺🇸', ja: '🇯🇵' };
            const labels = { ko: '한국어 (KO)', en: 'English (EN)', ja: '日本語 (JP)' };
            
            document.getElementById('current-lang-flag').textContent = flags[lang];
            document.getElementById('current-lang-label').textContent = labels[lang];
            
            const t = TRANSLATIONS[lang];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-subtitle').textContent = t.subtitle;
            document.getElementById('ui-save-all').textContent = t.saveAll;
            document.getElementById('ui-add-group').textContent = t.addGroup;
            document.getElementById('ui-group-actions').textContent = t.groupActions;
            document.getElementById('ui-rename').textContent = t.rename;
            document.getElementById('ui-delete').textContent = t.delete;
            document.getElementById('ui-review-title').textContent = t.reviewTitle;
            document.getElementById('ui-review-desc').textContent = t.reviewDesc;
            document.getElementById('ui-chat-title').textContent = t.chatTitle;
            document.getElementById('ui-chat-desc').textContent = t.chatDesc;
            
            document.getElementById('prompt-review').placeholder = t.promptPlaceholder;
            document.getElementById('prompt-chat').placeholder = t.promptPlaceholder;
        }

        async function fetchGroups() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/prompts/groups`);
                promptGroups = await res.json();
                renderGroups();
                if (promptGroups.length > 0) {
                    selectGroup(promptGroups[0].id);
                }
            } catch (err) {
                showToast(TRANSLATIONS[currentUIlang].msgFetchError, true);
            }
        }

        function renderGroups() {
            const list = document.getElementById('group-list');
            list.innerHTML = '';
            promptGroups.forEach(group => {
                const div = document.createElement('button');
                div.className = `group-item w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all flex items-center gap-3 ${selectedGroupId === group.id ? 'active bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}`;
                div.onclick = () => selectGroup(group.id);
                div.innerHTML = `
                    <span class="material-symbols-outlined !text-[18px] opacity-70">${group.id === 'default' ? 'star' : 'folder'}</span>
                    <span class="truncate">${group.name}</span>
                `;
                list.appendChild(div);
            });
        }

        async function selectGroup(id) {
            // Save current fields before switching if needed? 
            // For simplicity, we just switch and lose unsaved changes if not saved.
            selectedGroupId = id;
            renderGroups();
            await fetchPrompts();
        }

        async function fetchPrompts() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/prompts?group_id=${selectedGroupId}`);
                promptsData = await res.json();
                renderPrompts();
            } catch (err) {
                showToast(TRANSLATIONS[currentUIlang].msgFetchError, true);
            }
        }

        function renderPrompts() {
            const data = promptsData[currentPromptLang] || { review: '', chat: '' };
            document.getElementById('prompt-review').value = data.review || '';
            document.getElementById('prompt-chat').value = data.chat || '';

            document.querySelectorAll('.lang-tab').forEach(tab => {
                tab.classList.remove('active', 'border-blue-500', 'text-blue-600');
                tab.classList.add('border-transparent', 'text-slate-500');
                if (tab.classList.contains('tab-' + currentPromptLang)) {
                    tab.classList.add('active', 'border-blue-500', 'text-blue-600');
                    tab.classList.remove('border-transparent', 'text-slate-500');
                }
            });
        }

        function switchPromptLang(lang) {
            // Sync current editor to data object
            saveCurrentLangToData();
            currentPromptLang = lang;
            renderPrompts();
        }

        function saveCurrentLangToData() {
            promptsData[currentPromptLang] = {
                review: document.getElementById('prompt-review').value,
                chat: document.getElementById('prompt-chat').value
            };
        }

        async function handleSaveAll() {
            const t = TRANSLATIONS[currentUIlang];
            saveCurrentLangToData();

            const btn = document.querySelector('button[onclick="handleSaveAll()"]');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> ${t.msgSaving}`;

            try {
                const res = await fetch(`${API_BASE_URL}/api/prompts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        group_id: selectedGroupId,
                        ...promptsData
                    })
                });

                if (res.ok) {
                    showToast(t.msgSave);
                } else {
                    throw new Error();
                }
            } catch (err) {
                showToast(t.msgSaveError, true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        let modalCallback = null;

        function openModal({ title, placeholder, initialValue, isConfirm, callback }) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const inputContainer = document.getElementById('modal-input-container');
            const input = document.getElementById('modal-input');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            
            titleEl.textContent = title;
            modalCallback = callback;
            
            if (isConfirm) {
                inputContainer.classList.add('hidden');
                confirmBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                confirmBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            } else {
                inputContainer.classList.remove('hidden');
                input.placeholder = placeholder || '';
                input.value = initialValue || '';
                confirmBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                confirmBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }
            
            modal.classList.remove('hidden');
            if (!isConfirm) input.focus();
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            modalCallback = null;
        }

        function handleModalConfirm() {
            if (modalCallback) {
                const input = document.getElementById('modal-input');
                modalCallback(input.value);
            }
            closeModal();
        }

        async function createNewGroup() {
            const t = TRANSLATIONS[currentUIlang];
            openModal({
                title: t.addGroup,
                placeholder: t.msgNewGroupName,
                callback: async (name) => {
                    if (!name) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/prompts/groups`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        if (res.ok) {
                            const newGroup = await res.json();
                            promptGroups.push(newGroup);
                            renderGroups();
                            selectGroup(newGroup.id);
                        }
                    } catch (err) {
                        showToast(t.msgSaveError, true);
                    }
                }
            });
        }

        async function renameCurrentGroup() {
            const t = TRANSLATIONS[currentUIlang];
            if (selectedGroupId === 'default') return;

            const currentGroup = promptGroups.find(g => g.id === selectedGroupId);
            openModal({
                title: t.rename,
                initialValue: currentGroup.name,
                callback: async (newName) => {
                    if (!newName || newName === currentGroup.name) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/prompts/groups/${selectedGroupId}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: newName })
                        });
                        if (res.ok) {
                            currentGroup.name = newName;
                            renderGroups();
                        }
                    } catch (err) {
                        showToast(t.msgSaveError, true);
                    }
                }
            });
        }

        async function deleteCurrentGroup() {
            const t = TRANSLATIONS[currentUIlang];
            if (selectedGroupId === 'default') {
                showToast(t.msgCannotDeleteDefault, true);
                return;
            }

            openModal({
                title: t.msgConfirmDelete,
                isConfirm: true,
                callback: async () => {
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/prompts/groups/${selectedGroupId}`, {
                            method: 'DELETE'
                        });
                        if (res.ok) {
                            promptGroups = promptGroups.filter(g => g.id !== selectedGroupId);
                            selectedGroupId = 'default';
                            renderGroups();
                            selectGroup('default');
                        }
                    } catch (err) {
                        showToast(t.msgSaveError, true);
                    }
                }
            });
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            const icon = document.getElementById('toast-icon');
            icon.textContent = isError ? 'error' : 'check_circle';
            icon.className = isError ? 'material-symbols-outlined text-red-500' : 'material-symbols-outlined text-green-500';

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.onload = () => {
            setLanguage(currentUIlang);
            fetchGroups();
        };
    </script>
</body>

</html>
