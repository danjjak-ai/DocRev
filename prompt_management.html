<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 프롬프트 관리 - DocRev</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/symbols/outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .lang-tab.active {
            border-bottom-color: #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <a href="pdf_comment_workspace.html"
                    class="h-10 w-10 flex items-center justify-center rounded-full bg-white shadow-sm border border-slate-200 text-slate-500 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">AI 프롬프트 관리</h1>
                    <p class="text-sm text-slate-500">언어별 AI 분석 및 대화 프롬프트를 설정합니다.</p>
                </div>
            </div>
            <button id="btn-save-all"
                class="bg-primary hover:bg-blue-600 bg-blue-500 text-white px-6 py-2.5 rounded-lg font-semibold shadow-md flex items-center gap-2 transition-all transform hover:scale-[1.02]">
                <span class="material-symbols-outlined">save</span> 전체 저장
            </button>
        </header>

        <!-- Tabs -->
        <div class="flex border-b border-slate-200 mb-6 bg-white rounded-t-xl px-4">
            <button onclick="switchLang('ko')" id="tab-ko"
                class="lang-tab active px-6 py-4 text-sm font-semibold border-b-2 border-transparent transition-all">한국어
                (KO)</button>
            <button onclick="switchLang('ja')" id="tab-ja"
                class="lang-tab px-6 py-4 text-sm font-semibold border-b-2 border-transparent transition-all">일본어
                (JA)</button>
            <button onclick="switchLang('en')" id="tab-en"
                class="lang-tab px-6 py-4 text-sm font-semibold border-b-2 border-transparent transition-all">영어
                (EN)</button>
        </div>

        <!-- Prompt Forms -->
        <div class="space-y-6">
            <!-- Review Prompt -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
                    <span class="material-symbols-outlined text-blue-500">analytics</span>
                    <h2 class="font-bold text-slate-800">문서 분석 (Review) 프롬프트</h2>
                </div>
                <div class="p-6">
                    <p class="text-xs text-slate-500 mb-4">문서 업로드 시 가이드라인 위반 및 금지어를 분석하는 AI의 페르소나와 기준을 설정합니다.</p>
                    <textarea id="prompt-review"
                        class="w-full h-[400px] p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm font-mono leading-relaxed focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all custom-scrollbar"></textarea>
                </div>
            </div>

            <!-- Chat Prompt -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex items-center gap-2">
                    <span class="material-symbols-outlined text-green-500">chat_bubble</span>
                    <h2 class="font-bold text-slate-800">문서 질의응답 (Chat) 프롬프트</h2>
                </div>
                <div class="p-6">
                    <p class="text-xs text-slate-500 mb-4">채팅 위젯에서 문서의 내용을 바탕으로 답변할 때의 지침을 설정합니다.</p>
                    <textarea id="prompt-chat"
                        class="w-full h-32 p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm font-mono leading-relaxed focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all custom-scrollbar"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div id="toast"
        class="fixed bottom-8 right-8 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl transition-all translate-y-20 opacity-0 pointer-events-none flex items-center gap-3">
        <span class="material-symbols-outlined text-green-400" id="toast-icon">check_circle</span>
        <span id="toast-message">저장되었습니다.</span>
    </div>

    <script>
        let currentLang = 'ko';
        let promptsData = {};

        async function fetchPrompts() {
            try {
                const res = await fetch('http://localhost:5000/api/prompts');
                promptsData = await res.json();
                renderPrompts();
            } catch (err) {
                showToast('데이터를 불러오는데 실패했습니다.', true);
            }
        }

        function renderPrompts() {
            const data = promptsData[currentLang] || { review: '', chat: '' };
            document.getElementById('prompt-review').value = data.review;
            document.getElementById('prompt-chat').value = data.chat;
        }

        function switchLang(lang) {
            // Save current fields back to local data before switching
            promptsData[currentLang] = {
                review: document.getElementById('prompt-review').value,
                chat: document.getElementById('prompt-chat').value
            };

            currentLang = lang;

            // Update tabs
            document.querySelectorAll('.lang-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(`tab-${lang}`).classList.add('active');

            renderPrompts();
        }

        document.getElementById('btn-save-all').onclick = async () => {
            // Sync current fields to data object
            promptsData[currentLang] = {
                review: document.getElementById('prompt-review').value,
                chat: document.getElementById('prompt-chat').value
            };

            const btn = document.getElementById('btn-save-all');
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> 저장 중...';

            try {
                const res = await fetch('http://localhost:5000/api/prompts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(promptsData)
                });

                if (res.ok) {
                    showToast('모든 프롬프트가 성공적으로 저장되었습니다.');
                } else {
                    throw new Error('Save failed');
                }
            } catch (err) {
                showToast('저장 중 오류가 발생했습니다.', true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined">save</span> 전체 저장';
            }
        };

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            const icon = document.getElementById('toast-icon');
            icon.textContent = isError ? 'error' : 'check_circle';
            icon.className = isError ? 'material-symbols-outlined text-red-400' : 'material-symbols-outlined text-green-400';

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.onload = fetchPrompts;
    </script>
</body>

</html>
