<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Management - DocRev</title>
    <link href="css/output.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 0.5);
        }

        .sidebar-item.active {
            background-color: #eef2ff;
            color: #4f46e5;
            border-right: 4px solid #4f46e5;
        }
    </style>
</head>

<body class="min-h-screen text-gray-800 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-white shadow-sm z-50">
        <div class="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="material-icons text-indigo-600 text-3xl">library_books</span>
                <h1 id="titleText"
                    class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600">
                    RAG 가이드 문서 관리</h1>
            </div>
            <div class="flex items-center gap-4">
                <!-- Language Selector -->
                <div class="relative group">
                    <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 transition-colors">
                        <span class="material-icons text-gray-500 text-lg">language</span>
                        <span id="currentLang" class="text-sm font-medium">한국어</span>
                    </button>
                    <div class="absolute right-0 top-full mt-1 w-32 bg-white rounded-lg shadow-xl border border-gray-100 hidden group-hover:block overflow-hidden">
                        <button onclick="setLanguage('ko')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">한국어</button>
                        <button onclick="setLanguage('en')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">English</button>
                        <button onclick="setLanguage('ja')" class="w-full px-4 py-2 text-left text-sm hover:bg-indigo-50 transition-colors">日本語</button>
                    </div>
                </div>

                <a href="pdf_comment_workspace.html" id="backToWorkspace"
                    class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 transition-colors bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
                    <span class="material-icons text-sm">arrow_back</span>
                    <span class="text-sm font-medium">워크스페이스로 돌아가기</span>
                </a>
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 id="sidebarTitle" class="font-bold text-gray-700">벡터 데이터베이스</h3>
                <button onclick="createNewGroup()" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors">
                    <span class="material-icons">add_circle</span>
                </button>
            </div>
            <nav id="groupList" class="flex-1 overflow-y-auto py-2">
                <!-- Groups will be listed here -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <div id="noSelection" class="flex flex-col items-center justify-center h-full text-gray-400 hidden">
                <span class="material-icons text-6xl mb-4">folder_open</span>
                <p id="noSelectionText">그룹을 선택하거나 새로 만드세요.</p>
            </div>

            <div id="mainContent" class="max-w-4xl mx-auto space-y-6">
                <!-- Group Header Info -->
                <div class="glass-panel rounded-2xl p-6 flex items-center justify-between shadow-sm">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="selectedGroupName" class="text-2xl font-bold text-gray-900">-</h2>
                            <button onclick="renameCurrentGroup()" class="text-gray-400 hover:text-indigo-600 transition-colors">
                                <span class="material-icons text-lg">edit</span>
                            </button>
                        </div>
                        <p id="groupDescription" class="text-sm text-gray-500 mt-1">선택된 데이터베이스 그룹의 문서를 관리합니다.</p>
                    </div>
                    <button onclick="deleteCurrentGroup()" id="deleteGroupBtn" class="px-3 py-1.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors text-sm font-medium flex items-center gap-1">
                        <span class="material-icons text-sm">delete</span>
                        <span id="deleteGroupText">그룹 삭제</span>
                    </button>
                </div>

                <!-- Document List Section -->
                <div class="glass-panel rounded-2xl p-8 shadow-sm">
                    <h3 id="docListTitle" class="text-lg font-semibold text-gray-800 mb-6">문서 목록</h3>

                    <div class="mb-6 flex gap-4">
                        <input type="file" id="fileInput" multiple
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all cursor-pointer" />
                        <button onclick="uploadFile()" id="uploadBtn"
                            class="px-6 py-2 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:shadow-xl transition-all font-medium whitespace-nowrap flex items-center gap-2">
                            <span id="uploadIcon" class="material-icons text-sm">cloud_upload</span>
                            <span id="uploadText">업로드</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden mb-8">
                        <ul id="docList" class="divide-y divide-gray-100"></ul>
                    </div>

                    <div class="border-t border-gray-200 pt-8">
                        <div>
                            <h3 id="rebuildTitle" class="text-lg font-semibold text-gray-800">RAG 재구성</h3>
                            <p id="rebuildDesc" class="text-sm text-gray-500 mt-1">현재 그룹의 문서들을 분석하여 벡터 데이터베이스를 최신화합니다.</p>
                        </div>

                        <button id="reconstructBtn" onclick="startReconstruction()"
                            class="mt-4 w-full flex items-center justify-center gap-2 py-3 px-4 bg-gradient-to-r from-violet-600 to-indigo-600 text-white rounded-xl shadow-lg hover:shadow-xl hover:from-violet-700 hover:to-indigo-700 transition-all font-medium">
                            <span class="material-icons">autorenew</span>
                            <span id="rebuildBtnText">RAG 재구성 시작</span>
                        </button>

                        <!-- Status Container -->
                        <div id="statusContainer" class="hidden mt-4 p-4 rounded-xl border">
                            <div class="flex items-start gap-3">
                                <span id="statusIcon" class="material-icons mt-0.5 animate-spin text-indigo-500">sync</span>
                                <div>
                                    <p id="statusMessage" class="font-medium text-gray-800">진행 중...</p>
                                    <p id="processedFiles" class="text-sm text-gray-500 mt-1 hidden"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
                <h3 id="customModalTitle" class="text-lg font-bold text-slate-900">제목</h3>
                <button onclick="closeCustomModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div id="customModalInputContainer">
                    <input type="text" id="customModalInput" 
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all font-medium"
                        onkeypress="if(event.key==='Enter') handleCustomModalConfirm()">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="closeCustomModal()" 
                        class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-bold transition-all">취소</button>
                    <button id="customModalConfirmBtn" onclick="handleCustomModalConfirm()"
                        class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition-all shadow-lg shadow-blue-500/20">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-8 right-8 z-[200] bg-white border border-slate-200 rounded-xl shadow-2xl p-4 flex items-center gap-3 transition-all transform translate-y-20 opacity-0 pointer-events-none">
        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center">
            <span id="toastIcon" class="material-icons text-green-500">check_circle</span>
        </div>
        <p id="toastMessage" class="text-sm font-bold text-slate-700"></p>
    </div>

    <script>
        const TRANSLATIONS = {
            ko: {
                title: "RAG 가이드 문서 관리",
                back: "워크스페이스로 돌아가기",
                sidebar: "벡터 데이터베이스",
                noSelection: "그룹을 선택하거나 새로 만드세요.",
                deleteGroup: "그룹 삭제",
                groupDesc: "선택된 데이터베이스 그룹의 문서를 관리합니다.",
                docList: "문서 목록",
                upload: "업로드",
                uploading: "업로드 중...",
                rebuild: "RAG 재구성",
                rebuildDesc: "현재 그룹의 문서들을 분석하여 벡터 데이터베이스를 최신화합니다.",
                rebuildBtn: "RAG 재구성 시작",
                noDocs: "업로드된 문서가 없습니다.",
                deleteConfirm: "삭제하시겠습니까?",
                groupNamePrompt: "새 그룹 이름을 입력하세요:",
                renamePrompt: "새 이름을 입력하세요:",
                rebuildSuccess: "RAG 상태가 업데이트되었습니다.",
                rebuildRunning: "RAG 재구성을 진행 중입니다...",
                currentLangName: "한국어"
            },
            en: {
                title: "RAG Document Management",
                back: "Back to Workspace",
                sidebar: "Vector Databases",
                noSelection: "Select a group or create a new one.",
                deleteGroup: "Delete Group",
                groupDesc: "Manage documents for the selected vector database group.",
                docList: "Document List",
                upload: "Upload",
                uploading: "Uploading...",
                rebuild: "RAG Rebuild",
                rebuildDesc: "Analyze documents in the current group to update the vector database.",
                rebuildBtn: "Start RAG Rebuild",
                noDocs: "No documents uploaded.",
                deleteConfirm: "Are you sure you want to delete?",
                groupNamePrompt: "Enter new group name:",
                renamePrompt: "Enter new name:",
                rebuildSuccess: "RAG status updated.",
                rebuildRunning: "RAG rebuild in progress...",
                currentLangName: "English"
            },
            ja: {
                title: "RAGガイド文書管理",
                back: "ワークスペースに戻る",
                sidebar: "ベクトルデータベース",
                noSelection: "グループを選択するか、新しく作成してください。",
                deleteGroup: "グループ削除",
                groupDesc: "選択されたデータベースグループの文書を管理します。",
                docList: "文書リスト",
                upload: "アップロード",
                uploading: "アップロード中...",
                rebuild: "RAG再構築",
                rebuildDesc: "現在のグループの文書を分析して、ベクトルデータベースを最新化します。",
                rebuildBtn: "RAG再構築開始",
                noDocs: "アップロードされた文書はありません。",
                deleteConfirm: "本当に削除しますか？",
                groupNamePrompt: "新しいグループ名を入力してください:",
                renamePrompt: "新しい名前を入力してください:",
                rebuildSuccess: "RAG状態が更新されました。",
                rebuildRunning: "RAG再構築を行っています...",
                currentLangName: "日本語"
            }
        };

        let currentLang = 'ko';
        let groups = [];
        let selectedGroupId = null;
        let pollingInterval = null;

        function setLanguage(lang) {
            currentLang = lang;
            const t = TRANSLATIONS[lang];
            
            document.getElementById('titleText').textContent = t.title;
            document.getElementById('backToWorkspace').querySelector('span:last-child').textContent = t.back;
            document.getElementById('sidebarTitle').textContent = t.sidebar;
            document.getElementById('noSelectionText').textContent = t.noSelection;
            document.getElementById('deleteGroupText').textContent = t.deleteGroup;
            document.getElementById('groupDescription').textContent = t.groupDesc;
            document.getElementById('docListTitle').textContent = t.docList;
            document.getElementById('uploadText').textContent = t.upload;
            document.getElementById('rebuildTitle').textContent = t.rebuild;
            document.getElementById('rebuildDesc').textContent = t.rebuildDesc;
            document.getElementById('rebuildBtnText').textContent = t.rebuildBtn;
            document.getElementById('currentLang').textContent = t.currentLangName;

            renderGroups();
            if (selectedGroupId) loadGroupData();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').textContent = isError ? 'error' : 'check_circle';
            document.getElementById('toastIcon').className = `material-icons ${isError ? 'text-red-400' : 'text-green-400'}`;
            toast.classList.remove('translate-y-full', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-full', 'opacity-0'), 3000);
        }

        async function loadGroups() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/rag/groups`);
                groups = await res.json();
                renderGroups();
                if (groups.length > 0 && !selectedGroupId) {
                    selectGroup(groups[0].id);
                } else if (groups.length === 0) {
                    updateView(null);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderGroups() {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            groups.forEach(g => {
                const item = document.createElement('div');
                item.className = `sidebar-item px-6 py-3 cursor-pointer flex items-center gap-3 transition-all ${selectedGroupId === g.id ? 'active' : 'hover:bg-gray-50'}`;
                item.onclick = () => selectGroup(g.id);
                item.innerHTML = `
                    <span class="material-icons opacity-70">${selectedGroupId === g.id ? 'folder_open' : 'folder'}</span>
                    <span class="text-sm font-medium truncate">${g.name}</span>
                `;
                list.appendChild(item);
            });
        }

        function selectGroup(id) {
            selectedGroupId = id;
            renderGroups();
            updateView(id);
            loadGroupData();
            checkGroupStatus();
        }

        function updateView(id) {
            const main = document.getElementById('mainContent');
            const placeholder = document.getElementById('noSelection');
            if (id) {
                main.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                main.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        async function loadGroupData() {
            if (!selectedGroupId) return;
            const group = groups.find(g => g.id === selectedGroupId);
            document.getElementById('selectedGroupName').textContent = group ? group.name : '-';
            
            try {
                const res = await fetch(`${API_BASE_URL}/api/reference-docs?group_id=${selectedGroupId}`);
                const files = await res.json();
                const list = document.getElementById('docList');
                list.innerHTML = '';

                if (files.length === 0) {
                    list.innerHTML = `<li class="px-6 py-8 text-center text-gray-500">${TRANSLATIONS[currentLang].noDocs}</li>`;
                    return;
                }

                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors';
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="material-icons text-red-500">description</span>
                            <span class="font-medium text-gray-700">${file}</span>
                        </div>
                        <button onclick="deleteFile('${file}')" class="text-gray-400 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-red-50">
                            <span class="material-icons">delete</span>
                        </button>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            const icon = document.getElementById('toastIcon');
            icon.textContent = isError ? 'error' : 'check_circle';
            icon.className = `material-icons ${isError ? 'text-red-500' : 'text-green-500'}`;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        let customModalCallback = null;

        function openCustomModal({ title, placeholder, initialValue, isConfirm, callback }) {
            document.getElementById('customModalTitle').textContent = title;
            document.getElementById('customModalInput').placeholder = placeholder || '';
            document.getElementById('customModalInput').value = initialValue || '';
            
            const inputContainer = document.getElementById('customModalInputContainer');
            const confirmBtn = document.getElementById('customModalConfirmBtn');
            
            if (isConfirm) {
                inputContainer.classList.add('hidden');
                confirmBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                confirmBtn.classList.add('bg-red-600', 'hover:bg-red-700');
            } else {
                inputContainer.classList.remove('hidden');
                confirmBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
                confirmBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
            }
            
            customModalCallback = callback;
            document.getElementById('custom-modal').classList.remove('hidden');
            if (!isConfirm) document.getElementById('customModalInput').focus();
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            customModalCallback = null;
        }

        function handleCustomModalConfirm() {
            if (customModalCallback) {
                customModalCallback(document.getElementById('customModalInput').value);
            }
            closeCustomModal();
        }

        async function createNewGroup() {
            const t = TRANSLATIONS[currentLang];
            openCustomModal({
                title: t.sidebar,
                placeholder: t.groupNamePrompt,
                callback: async (name) => {
                    if (!name) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/rag/groups`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        if (res.ok) {
                            const newGroup = await res.json();
                            await loadGroups();
                            selectGroup(newGroup.id);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }
            });
        }

        async function renameCurrentGroup() {
            const t = TRANSLATIONS[currentLang];
            if (!selectedGroupId || selectedGroupId === 'default') return;

            const group = groups.find(g => g.id === selectedGroupId);
            openCustomModal({
                title: t.renamePrompt,
                initialValue: group ? group.name : "",
                callback: async (name) => {
                    if (!name || (group && name === group.name)) return;
                    try {
                        await fetch(`${API_BASE_URL}/api/rag/groups/${selectedGroupId}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        loadGroups();
                    } catch (err) {
                        console.error(err);
                    }
                }
            });
        }

        async function deleteCurrentGroup() {
            const t = TRANSLATIONS[currentLang];
            if (!selectedGroupId || selectedGroupId === 'default') return;

            openCustomModal({
                title: t.deleteConfirm,
                isConfirm: true,
                callback: async () => {
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/rag/groups/${selectedGroupId}`, { method: 'DELETE' });
                        if (res.ok) {
                            selectedGroupId = null;
                            loadGroups();
                        } else {
                            const err = await res.json();
                            showToast(err.error, true);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }
            });
        }

        async function uploadFile() {
            const input = document.getElementById('fileInput');
            if (input.files.length === 0) return;

            const btn = document.getElementById('uploadBtn');
            const text = document.getElementById('uploadText');
            btn.disabled = true;
            text.textContent = TRANSLATIONS[currentLang].uploading;

            const formData = new FormData();
            formData.append('group_id', selectedGroupId);
            for (let f of input.files) formData.append('file', f);

            try {
                const res = await fetch(`${API_BASE_URL}/api/reference-docs/upload`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    input.value = '';
                    loadGroupData();
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                text.textContent = TRANSLATIONS[currentLang].upload;
            }
        }

        async function deleteFile(name) {
            const t = TRANSLATIONS[currentLang];
            openCustomModal({
                title: t.deleteConfirm,
                isConfirm: true,
                callback: async () => {
                    try {
                        await fetch(`${API_BASE_URL}/api/reference-docs/${encodeURIComponent(name)}?group_id=${selectedGroupId}`, {
                            method: 'DELETE'
                        });
                        loadGroupData();
                    } catch (err) {
                        console.error(err);
                    }
                }
            });
        }

        async function startReconstruction() {
            try {
                await fetch(`${API_BASE_URL}/api/rag/reconstruct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ group_id: selectedGroupId })
                });
                checkGroupStatus();
            } catch (err) {
                console.error(err);
            }
        }

        async function checkGroupStatus() {
            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/rag/status?group_id=${selectedGroupId}`);
                    const status = await res.json();
                    updateStatusUI(status);
                    if (!status.is_running && pollingInterval) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                    }
                } catch (err) {
                    console.error(err);
                }
            }, 2000);
        }

        function updateStatusUI(status) {
            const container = document.getElementById('statusContainer');
            const msg = document.getElementById('statusMessage');
            const btn = document.getElementById('reconstructBtn');
            const icon = document.getElementById('statusIcon');

            if (status.is_running) {
                container.classList.remove('hidden');
                msg.textContent = TRANSLATIONS[currentLang].rebuildRunning;
                btn.disabled = true;
                btn.classList.add('opacity-50');
                icon.classList.add('animate-spin');
            } else {
                if (status.message) {
                    container.classList.remove('hidden');
                    msg.textContent = status.message;
                    icon.classList.remove('animate-spin');
                    icon.textContent = 'check_circle';
                    icon.className = 'material-icons text-green-500';
                } else {
                    container.classList.add('hidden');
                }
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        // Init
        loadGroups();
    </script>
</body>

</html>
